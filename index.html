<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="viewer-version" content="1.5" />
  <meta name="theme-color" content="#0f1419" />
  <title>北单7双选 1.5</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <strong>北单7双选</strong>
      <span class="ver-pill">1.5</span>
    </div>
    <div class="build" id="build">加载中…</div>
    <div class="disclaimer" id="disclaimer">研究观察 · 不出票 · 非投注建议</div>
  </header>

  <div class="switch-row" id="switch-row">
    <button type="button" class="chip-sw active" data-desk="beidan7">北单7</button>
    <button type="button" class="chip-sw" data-desk="jingcai">竞彩双选</button>
    <button type="button" class="chip-sw ghost" data-mode="all" id="tab-all">全部场次</button>
  </div>

  <section class="desk" id="desk">
    <p class="desk-note" id="desk-note"></p>
    <div class="desk-list" id="desk-list"></div>
  </section>

  <div class="toolbar" id="toolbar" hidden>
    <input id="q" type="search" placeholder="搜队名 / 编号" />
    <select id="product">
      <option value="beidan" selected>北单</option>
      <option value="jingcai">竞彩</option>
      <option value="all">全部</option>
    </select>
    <select id="badge">
      <option value="all">角标</option>
      <option value="观察">观察</option>
      <option value="精选">精选</option>
      <option value="none">无</option>
    </select>
    <select id="report" hidden>
      <option value="all">全部研报</option>
      <option value="yes">有研报</option>
      <option value="final">终稿</option>
    </select>
  </div>

  <aside class="list" id="list" hidden></aside>

  <section class="detail sheet" id="detail" hidden>
    <button type="button" class="back" id="back-btn">← 返回短表</button>
    <div id="detail-body"><div class="empty">选一场</div></div>
  </section>

  <script src="./app.js"></script>
</body>
</html>
