<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="viewer-version" content="1.3" />
  <title>北单·竞彩 查看器 1.3</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand-block">
      <div class="brand">
        <strong>北单·竞彩</strong>
        <span class="ver-pill" title="FMA 小更新线 1.3">1.3</span>
        <span class="muted">查看器</span>
      </div>
      <div class="build" id="build">版本 1.3 · 先足球后市场 · 研究观察</div>
    </div>
    <div id="meta" class="meta"></div>
    <div class="disclaimer" id="disclaimer">研究观察 · 不出票 · 非投注建议</div>
  </header>
  <div class="toolbar">
    <input id="q" type="search" placeholder="搜编号 / 队名 / 联赛" />
    <select id="product">
      <option value="all">全部产品</option>
      <option value="jingcai">竞彩</option>
      <option value="beidan">北单</option>
    </select>
    <select id="badge">
      <option value="all">全部角标</option>
      <option value="精选">精选</option>
      <option value="观察">观察</option>
      <option value="none">无角标</option>
    </select>
    <select id="report">
      <option value="all">全部研报</option>
      <option value="yes">有研报</option>
      <option value="final">终稿倾向</option>
    </select>
  </div>
  <main class="layout">
    <aside class="list" id="list"><div class="empty">加载场次中…</div></aside>
    <section class="detail" id="detail"><div class="empty">加载研报中…</div></section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
